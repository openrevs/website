title: OpenRevs
description: One-line description of the project goes here.
url: https://openrevs.org

# Theme: Just the Docs (https://just-the-docs.com), pinned to a release.
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

search_enabled: true
#color_scheme: dark

# Enable Mermaid diagrams (```mermaid code blocks).
mermaid:
  version: "11.4.1"

# Links shown at the top right. Point this at your main GitHub repo or org.
# aux_links:
#   GitHub: https://github.com/OWNER

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Dockerfile
  - compose.yaml
  - specs/samples   # WIP sample data; not published
